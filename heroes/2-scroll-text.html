<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 2 — Text, der sich beim Scrollen aufhellt</title>
<meta name="description" content="Hero-Vorlage: Aussage, die sich Wort für Wort beim Scrollen aufbaut.">
<style>
/* ===========================================================================
   HERO 2 — TEXT, DER SICH BEIM SCROLLEN AUFHELLT
   Passt zu: Treuhand, Anwalt, Beratung, Arzt, Versicherung, Architektur.
   Wirkung: seriös, ruhig, wortlastig — ohne dass ein einziges Foto nötig ist.
   Genau der Fall, in dem der Kunde keine guten Bilder hat.

   ANPASSEN: KONFIG-Block unten und die Farben hier.
   =========================================================================== */
:root {
  --grund:   #12100E;
  --hell:    #F6F2EA;   /* Wort im Vordergrund */
  --blass:   #4A443C;   /* Wort, das noch nicht dran ist */
  --akzent:  #B98A2E;   /* betonte Wörter */
  --linie:   #2A2622;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--grund);
  color: var(--hell);
  font-family: "Georgia", "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
}

/* Die Bühne ist absichtlich hoch: die Höhe IST der Scroll-Weg, über den
   sich der Satz aufbaut. Kürzer = schneller, länger = getragener. */
.buehne { height: 320vh; position: relative; }

.klebt {
  position: sticky;
  top: 0;
  height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 clamp(22px, 6vw, 90px);
  overflow: hidden;
}

.kopfzeile {
  position: absolute;
  top: clamp(26px, 5vh, 54px);
  left: clamp(22px, 6vw, 90px);
  right: clamp(22px, 6vw, 90px);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 20px;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--akzent);
  padding-bottom: 16px;
  border-bottom: 1px solid var(--linie);
}
.kopfzeile span:last-child { color: var(--blass); }

.satz {
  font-size: clamp(1.75rem, 5.1vw, 4.1rem);
  line-height: 1.24;
  letter-spacing: -0.02em;
  font-weight: 400;
  margin: 0;
  max-width: 22ch;
}
.wort {
  color: var(--blass);
  transition: color .45s ease;
}
.wort.an     { color: var(--hell); }
.wort.betont.an { color: var(--akzent); }

.fuss {
  position: absolute;
  bottom: clamp(26px, 5vh, 54px);
  left: clamp(22px, 6vw, 90px);
  right: clamp(22px, 6vw, 90px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.knopf {
  font: inherit;
  font-size: .92rem;
  font-weight: 600;
  padding: 14px 28px;
  background: var(--akzent);
  color: #17130A;
  text-decoration: none;
  border-radius: 2px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.3,1);
  pointer-events: none;
}
.knopf.da { opacity: 1; transform: none; pointer-events: auto; }
.knopf:focus-visible { outline: 2px solid var(--hell); outline-offset: 3px; }

/* Fortschrittsbalken: zeigt, wie weit der Satz ist. Kleine Sache, aber sie
   verhindert das Gefühl, in einer endlosen Sektion festzuhängen. */
.balken {
  flex: 1 1 120px;
  height: 1px;
  background: var(--linie);
  position: relative;
  min-width: 90px;
  max-width: 320px;
}
.balken i {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--akzent);
  transform-origin: left;
  transform: scaleX(0);
}

.danach {
  min-height: 70vh;
  display: grid;
  place-items: center;
  padding: 80px 24px;
  color: var(--blass);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px;
  text-align: center;
}

/* Ohne Bewegung: alles sofort lesbar, Bühne auf normale Höhe. */
@media (prefers-reduced-motion: reduce) {
  .buehne { height: auto; }
  .klebt { position: static; height: auto; padding-block: 20vh; }
  .wort { color: var(--hell); transition: none; }
  .wort.betont { color: var(--akzent); }
  .knopf { opacity: 1; transform: none; pointer-events: auto; }
  .kopfzeile, .fuss { position: static; margin-block: 24px; }
}
</style>
</head>
<body>

<section class="buehne" id="buehne">
  <div class="klebt">
    <div class="kopfzeile">
      <span id="marke"></span>
      <span id="ort"></span>
    </div>

    <p class="satz" id="satz"></p>

    <div class="fuss">
      <a class="knopf" id="knopf" href="#"></a>
      <div class="balken"><i id="fortschritt"></i></div>
    </div>
  </div>
</section>

<div class="danach">Ab hier folgt der Rest der Seite.</div>

<script>
/* ===========================================================================
   KONFIG
   =========================================================================== */
const KONFIG = {
  marke: "Treuhand Meier & Partner",
  ort:   "Zürich · seit 1988",

  /* Der Satz. Wörter in *Sternchen* werden in der Akzentfarbe hervorgehoben.
     Faustregel: 12 bis 20 Wörter. Länger, und niemand scrollt bis zum Ende. */
  satz: "Wir kümmern uns um Ihre Buchhaltung, damit Sie sich um *Ihr Geschäft* kümmern können.",

  knopf: { text: "Erstgespräch vereinbaren", ziel: "#kontakt" },
};

/* --------------------------------------------------------------------------
   Ab hier muss nichts mehr angefasst werden.
   -------------------------------------------------------------------------- */

document.getElementById("marke").textContent = KONFIG.marke;
document.getElementById("ort").textContent = KONFIG.ort;
document.getElementById("knopf").textContent = KONFIG.knopf.text;
document.getElementById("knopf").href = KONFIG.knopf.ziel;

/* Satz in Wörter zerlegen. Jedes Wort bekommt ein eigenes Element — das ist
   dasselbe Prinzip wie GSAP SplitText, nur ohne Bibliothek. */
const satzFeld = document.getElementById("satz");
const woerter = KONFIG.satz.split(/\s+/).map((roh) => {
  const betont = roh.startsWith("*") || roh.endsWith("*") || /\*/.test(roh);
  const el = document.createElement("span");
  el.className = "wort" + (betont ? " betont" : "");
  el.textContent = roh.replace(/\*/g, "");
  satzFeld.append(el, document.createTextNode(" "));
  return el;
});

const buehne = document.getElementById("buehne");
const fortschritt = document.getElementById("fortschritt");
const knopf = document.getElementById("knopf");
const sanft = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let laeuft = false;
function aktualisieren() {
  laeuft = false;
  const rand = buehne.getBoundingClientRect();
  const weg = buehne.offsetHeight - window.innerHeight;
  if (weg <= 0) return;

  /* 0 = Sektion beginnt, 1 = Sektion ist durchgescrollt. */
  const anteil = Math.min(1, Math.max(0, -rand.top / weg));

  /* Die Wörter füllen sich über die ersten 78 % des Wegs. Der Rest ist
     Nachlauf, damit der fertige Satz einen Moment stehen bleibt. */
  const bisWort = (anteil / 0.78) * woerter.length;
  woerter.forEach((el, i) => el.classList.toggle("an", i < bisWort));

  fortschritt.style.transform = `scaleX(${anteil})`;
  knopf.classList.toggle("da", anteil > 0.72);
}

if (!sanft) {
  window.addEventListener("scroll", () => {
    if (!laeuft) { laeuft = true; requestAnimationFrame(aktualisieren); }
  }, { passive: true });
  window.addEventListener("resize", aktualisieren, { passive: true });
  aktualisieren();
}
</script>
</body>
</html>
