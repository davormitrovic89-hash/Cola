<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 3 — Fliessender Verlauf</title>
<meta name="description" content="Hero-Vorlage: fliessender WebGL-Verlauf, der auf die Maus reagiert.">
<style>
/* ===========================================================================
   HERO 3 — FLIESSENDER VERLAUF (WebGL)
   Passt zu: Agentur, IT, Startup, Coaching, Finanzdienstleister, Labor.
   Wirkung: modern, teuer, ohne ein einziges Foto. Der Effekt, für den es
   sonst ein Abo (Unicorn Studio) braucht — hier als knapp 60 Zeilen Shader.

   Kosten: ein Canvas, kein Netzwerkzugriff, keine Bibliothek.
   Auf schwachen Geräten und bei "Bewegung reduzieren" schaltet die Vorlage
   selbstständig auf einen statischen CSS-Verlauf um.
   =========================================================================== */
:root {
  --schrift: #ECEEF2;
  --gedimmt: rgba(236,238,242,.72);
  --akzent:  #6FE3C4;
  --grund:   #070A12;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--grund);
  color: var(--schrift);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.hero {
  position: relative;
  min-height: 100svh;
  display: grid;
  place-items: center;
  overflow: hidden;
  isolation: isolate;
  text-align: center;
}

#leinwand {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  display: block;
}

/* Fällt der Shader aus, bleibt dieser Verlauf sichtbar — die Seite sieht
   dann ruhiger aus, aber nie kaputt. */
.ersatz {
  position: absolute;
  inset: 0;
  z-index: -3;
  background:
    radial-gradient(60% 70% at 22% 28%, #1C3A6E 0%, transparent 62%),
    radial-gradient(55% 65% at 78% 68%, #0E5E56 0%, transparent 60%),
    var(--grund);
}

/* Feines Raster: gibt dem weichen Verlauf eine Kante und wirkt technisch. */
.raster {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .5;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 68px 68px;
  mask-image: radial-gradient(70% 60% at 50% 50%, #000 20%, transparent 78%);
}

.inhalt {
  position: relative;
  padding: 0 clamp(22px, 6vw, 64px);
  max-width: 980px;
}

.pille {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: 11.5px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--akzent);
  border: 1px solid rgba(111,227,196,.32);
  border-radius: 999px;
  padding: 8px 16px;
  margin-bottom: 28px;
  backdrop-filter: blur(6px);
}
.pille::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--akzent);
  box-shadow: 0 0 10px var(--akzent);
}

h1 {
  font-size: clamp(2.3rem, 6.6vw, 4.8rem);
  line-height: 1.03;
  letter-spacing: -0.04em;
  font-weight: 700;
  margin: 0 0 22px;
  text-wrap: balance;
}
h1 em { font-style: normal; color: var(--akzent); }

.unterzeile {
  font-size: clamp(1rem, 1.8vw, 1.2rem);
  line-height: 1.6;
  color: var(--gedimmt);
  max-width: 52ch;
  margin: 0 auto 34px;
}

.knoepfe { display: flex; gap: 13px; justify-content: center; flex-wrap: wrap; }
.knopf {
  font: inherit;
  font-size: .93rem;
  font-weight: 600;
  padding: 14px 30px;
  border-radius: 999px;
  text-decoration: none;
  border: 1px solid transparent;
  transition: transform .25s cubic-bezier(.2,.7,.3,1), background-color .25s, border-color .25s;
}
.knopf.voll { background: var(--akzent); color: #04231C; }
.knopf.leer { border-color: rgba(236,238,242,.28); color: var(--schrift); }
.knopf:hover { transform: translateY(-2px); }
.knopf.leer:hover { border-color: var(--schrift); }
.knopf:focus-visible { outline: 2px solid var(--schrift); outline-offset: 3px; }

.auftritt { opacity: 0; transform: translateY(18px); }
.geladen .auftritt {
  opacity: 1; transform: none;
  transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.3,1);
}
.geladen .auftritt:nth-child(1) { transition-delay: .08s; }
.geladen .auftritt:nth-child(2) { transition-delay: .20s; }
.geladen .auftritt:nth-child(3) { transition-delay: .32s; }
.geladen .auftritt:nth-child(4) { transition-delay: .44s; }

.danach {
  min-height: 70vh;
  display: grid;
  place-items: center;
  padding: 80px 24px;
  color: rgba(236,238,242,.42);
  font-size: 14px;
  text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  .auftritt { opacity: 1; transform: none; transition: none; }
}
</style>
</head>
<body>

<section class="hero">
  <div class="ersatz"></div>
  <canvas id="leinwand" aria-hidden="true"></canvas>
  <div class="raster" aria-hidden="true"></div>

  <div class="inhalt">
    <span class="pille auftritt" id="pille"></span>
    <h1 class="auftritt" id="titel"></h1>
    <p class="unterzeile auftritt" id="unterzeile"></p>
    <div class="knoepfe auftritt">
      <a class="knopf voll" id="knopf1" href="#"></a>
      <a class="knopf leer" id="knopf2" href="#"></a>
    </div>
  </div>
</section>

<div class="danach">Ab hier folgt der Rest der Seite.</div>

<script>
/* ===========================================================================
   KONFIG
   =========================================================================== */
const KONFIG = {
  pille:      "Verfügbar ab Oktober",
  /* *Sternchen* hebt in der Akzentfarbe hervor. */
  titel:      "Software, die Ihr Team *tatsächlich* benutzt.",
  unterzeile: "Wir bauen interne Werkzeuge für Schweizer KMU — in Wochen statt Quartalen, mit Ihren Leuten statt über deren Köpfe hinweg.",
  knopf1:     { text: "Projekt besprechen", ziel: "#kontakt" },
  knopf2:     { text: "Referenzen",         ziel: "#arbeiten" },

  /* Die drei Farben des Verlaufs, als 0–1-Werte für Rot, Grün, Blau.
     Tipp: eine dunkle Grundfarbe, eine mittlere Markenfarbe, ein heller
     Akzent. Zu viel Sättigung wirkt schnell nach Bildschirmschoner. */
  verlauf: [
    [0.05, 0.09, 0.20],
    [0.09, 0.34, 0.44],
    [0.42, 0.88, 0.76],
  ],
  tempo: 0.10,   // 0.05 = sehr getragen, 0.3 = unruhig
};

/* --------------------------------------------------------------------------
   Ab hier muss nichts mehr angefasst werden.
   -------------------------------------------------------------------------- */

const $ = (id) => document.getElementById(id);
$("pille").textContent = KONFIG.pille;
$("titel").innerHTML = KONFIG.titel
  .replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/\*(.+?)\*/g, "<em>$1</em>");
$("unterzeile").textContent = KONFIG.unterzeile;
$("knopf1").textContent = KONFIG.knopf1.text; $("knopf1").href = KONFIG.knopf1.ziel;
$("knopf2").textContent = KONFIG.knopf2.text; $("knopf2").href = KONFIG.knopf2.ziel;

requestAnimationFrame(() => document.body.classList.add("geladen"));

/* --- Der Shader ---------------------------------------------------------
   Zwei überlagerte Rauschfelder, die langsam gegeneinander driften. Die
   Mausposition verschiebt das Feld leicht — genug, dass es lebendig wirkt,
   wenig genug, dass es nicht ablenkt. */
const VERTEX = `
attribute vec2 pos;
void main() { gl_Position = vec4(pos, 0.0, 1.0); }
`;

const FRAGMENT = `
precision mediump float;
uniform vec2  aufloesung;
uniform float zeit;
uniform vec2  maus;
uniform vec3  farbe1;
uniform vec3  farbe2;
uniform vec3  farbe3;

// Wertrauschen: billig, ausreichend weich für einen Verlauf.
float zufall(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}
float rauschen(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(zufall(i + vec2(0.0, 0.0)), zufall(i + vec2(1.0, 0.0)), u.x),
             mix(zufall(i + vec2(0.0, 1.0)), zufall(i + vec2(1.0, 1.0)), u.x), u.y);
}
// Mehrere Oktaven übereinander ergeben die wolkige Struktur.
float wolken(vec2 p) {
  float summe = 0.0, gewicht = 0.5;
  for (int i = 0; i < 5; i++) {
    summe += gewicht * rauschen(p);
    p *= 2.03;
    gewicht *= 0.5;
  }
  return summe;
}

void main() {
  vec2 uv = gl_FragCoord.xy / aufloesung.xy;
  vec2 p = uv;
  p.x *= aufloesung.x / aufloesung.y;      // Seitenverhältnis ausgleichen
  p += maus * 0.14;

  float a = wolken(p * 1.9 + vec2(zeit * 0.9, zeit * 0.5));
  float b = wolken(p * 2.7 - vec2(zeit * 0.6, zeit * 0.8) + a);

  vec3 farbe = mix(farbe1, farbe2, smoothstep(0.22, 0.78, a));
  farbe = mix(farbe, farbe3, smoothstep(0.55, 0.95, b) * 0.62);

  // Zum Rand hin abdunkeln, damit die Schrift in der Mitte trägt.
  float vignette = smoothstep(1.25, 0.25, length(uv - 0.5) * 1.7);
  farbe *= 0.42 + vignette * 0.58;

  gl_FragColor = vec4(farbe, 1.0);
}
`;

(function verlaufStarten() {
  const leinwand = $("leinwand");
  const sanft = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const schwach = (navigator.hardwareConcurrency || 4) <= 2;
  if (sanft || schwach) { leinwand.remove(); return; }   // CSS-Ersatz übernimmt

  const gl = leinwand.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
  if (!gl) { leinwand.remove(); return; }

  function bauen(typ, quelle) {
    const s = gl.createShader(typ);
    gl.shaderSource(s, quelle);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn("Shader:", gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }
  const vs = bauen(gl.VERTEX_SHADER, VERTEX);
  const fs = bauen(gl.FRAGMENT_SHADER, FRAGMENT);
  if (!vs || !fs) { leinwand.remove(); return; }

  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { leinwand.remove(); return; }
  gl.useProgram(prog);

  // Zwei Dreiecke, die den ganzen Bildschirm ausfüllen.
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, "pos");
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

  const u = (n) => gl.getUniformLocation(prog, n);
  const uAufloesung = u("aufloesung"), uZeit = u("zeit"), uMaus = u("maus");
  gl.uniform3fv(u("farbe1"), KONFIG.verlauf[0]);
  gl.uniform3fv(u("farbe2"), KONFIG.verlauf[1]);
  gl.uniform3fv(u("farbe3"), KONFIG.verlauf[2]);

  // Pixeldichte deckeln: ein Retina-Bildschirm würde sonst viermal so viele
  // Bildpunkte rechnen, ohne dass man den Unterschied sieht.
  function anpassen() {
    const dichte = Math.min(window.devicePixelRatio || 1, 1.5);
    leinwand.width  = Math.floor(leinwand.clientWidth  * dichte);
    leinwand.height = Math.floor(leinwand.clientHeight * dichte);
    gl.viewport(0, 0, leinwand.width, leinwand.height);
    gl.uniform2f(uAufloesung, leinwand.width, leinwand.height);
  }
  anpassen();
  window.addEventListener("resize", anpassen, { passive: true });

  let zielX = 0, zielY = 0, istX = 0, istY = 0;
  window.addEventListener("pointermove", (e) => {
    zielX = (e.clientX / window.innerWidth) * 2 - 1;
    zielY = (e.clientY / window.innerHeight) * 2 - 1;
  }, { passive: true });

  // Nur rechnen, solange der Hero sichtbar ist. Scrollt jemand weiter,
  // steht die Grafik still und die Seite verbraucht nichts mehr.
  let sichtbar = true;
  new IntersectionObserver(([e]) => {
    sichtbar = e.isIntersecting;
    if (sichtbar) requestAnimationFrame(bild);
  }, { threshold: 0 }).observe(leinwand);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && sichtbar) requestAnimationFrame(bild);
  });

  const start = performance.now();
  function bild(jetzt) {
    if (!sichtbar || document.hidden) return;
    istX += (zielX - istX) * 0.045;          // nachziehen statt springen
    istY += (zielY - istY) * 0.045;
    gl.uniform2f(uMaus, istX, istY);
    gl.uniform1f(uZeit, ((jetzt - start) / 1000) * KONFIG.tempo);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(bild);
  }
  requestAnimationFrame(bild);
})();
</script>
</body>
</html>
